<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at top, #220022, #000);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
    }

    .scene {
        position: relative;
        width: 400px;
        height: 360px;
    }

    .flower {
        position: absolute;
        font-size: 18px;
        animation: float 4s ease-in-out infinite;
        filter: drop-shadow(0 0 6px #ff77aa);
    }

    @keyframes float {
        0% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.08); }
        100% { transform: translateY(0) scale(1); }
    }

    .light {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff, #ff99cc, rgba(255,255,255,0));
        box-shadow: 0 0 12px #ffaad5, 0 0 20px #ff4d88;
        animation: sparkle 1.8s infinite;
    }

    @keyframes sparkle {
        0% { transform: scale(0.3); opacity: 0.2; }
        50% { transform: scale(1.8); opacity: 1; }
        100% { transform: scale(0.3); opacity: 0.2; }
    }

    .text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ffd6e8;
        font-size: 36px;
        font-weight: 600;
        text-shadow: 0 0 15px #ff4d88, 0 0 30px #ff99cc;
        animation: pulse 2s infinite;
        pointer-events: none;
    }

    @keyframes pulse {
        0% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    }

    audio {
        display: none;
    }
</style>
</head>
<body>

<div class="scene">
    <div class="text">Para ti</div>
</div>

<!-- 🎵 Música -->
<audio autoplay loop>
    <source src="musica/love.mpeg">
</audio>

<script>
const scene = document.querySelector('.scene');
const flowers = ["🌸","🌺","🌹","🌷","💐"];

const points = [];
for (let t = 0; t < Math.PI * 2; t += 0.12) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    points.push({ x, y });
}

points.forEach((p, i) => {
    const cx = 200;
    const cy = 180;
    const fx = cx + p.x * 10;
    const fy = cy + p.y * 10;

    const f = document.createElement("div");
    f.className = "flower";
    f.textContent = flowers[Math.floor(Math.random() * flowers.length)];
    f.style.left = fx + "px";
    f.style.top = fy + "px";
    f.style.animationDelay = (i * 0.04) + "s";
    scene.appendChild(f);

    for (let j = 0; j < 3; j++) {
        const l = document.createElement("div");
        l.className = "light";
        l.style.left = (fx + Math.random() * 18 - 9) + "px";
        l.style.top = (fy + Math.random() * 18 - 9) + "px";
        l.style.animationDelay = (Math.random() * 2) + "s";
        scene.appendChild(l);
    }
});
</script>

</body>
</html>
